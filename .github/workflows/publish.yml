name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for trusted publishing to PyPI

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test,dev]"
        pip install build twine

    - name: Run linters
      run: |
        black --check glogformat/ tests/
        isort --check-only glogformat/ tests/
        pylint glogformat/ tests/

    - name: Run type checker
      run: mypy glogformat/

    - name: Run tests
      run: pytest tests/ -v --cov=glogformat

    - name: Build package
      run: python -m build

    - name: Publish to TestPyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: python -m twine upload --skip-existing --repository testpypi dist/*

    - name: Test installation from TestPyPI
      run: |
        python -m pip install --index-url https://test.pypi.org/simple/ --no-deps glogformat
        python -c "from glogformat import setup_stderr_logging; import logging; log = logging.getLogger('test'); setup_stderr_logging(logging.INFO); log.info('TestPyPI installation successful')"

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
